<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOCITY — Machines</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#ff2638;--bg:#080808;--panel:#141414;--muted:#999}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#fff}
header{padding:25px 7%;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:900;letter-spacing:4px}
.logo span{color:var(--red)}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{color:#ccc;text-decoration:none;font-size:13px}
nav a:hover{color:var(--red)}
.hero{padding:65px 7% 35px}
.eyebrow{color:var(--red);letter-spacing:4px;font-size:12px;font-weight:bold}
h1{font-size:clamp(38px,7vw,75px);margin:15px 0}
.hero p{color:#aaa;max-width:600px;line-height:1.7}
.controls{padding:10px 7% 35px;display:flex;gap:12px;flex-wrap:wrap}
input,select{background:#151515;color:#fff;border:1px solid #333;padding:14px;border-radius:5px;min-width:200px}
input:focus,select:focus{outline:1px solid var(--red)}
.grid{padding:0 7% 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:var(--panel);border:1px solid #292929;border-radius:8px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--red)}
.card img{width:100%;height:205px;object-fit:cover;background:#222;display:block}
.card-body{padding:20px}
.number{font-size:11px;color:var(--red);letter-spacing:2px}
h2{font-size:22px;margin:10px 0}
.brand{color:#999;font-size:13px}
.specs{display:flex;gap:20px;margin:18px 0;color:#ccc;font-size:13px}
.actions{display:flex;gap:9px}
.btn{flex:1;text-align:center;padding:12px 8px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:12px;border:1px solid #444;color:white;background:#202020;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn:hover{filter:brightness(1.15)}
.favorite.active{color:var(--red);border-color:var(--red)}
.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:40px}
footer{padding:25px 7%;border-top:1px solid #252525;color:#777;font-size:12px;letter-spacing:2px}
</style>
</head>

<body>
<header>
  <a href="index.html" class="logo" style="color:white;text-decoration:none">VELO<span>CITY</span></a>
  <nav>
    <a href="index.html">HOME</a>
    <a href="machines.html">THE MACHINES</a>
    <a href="sounds.html">ENGINE SOUND LAB</a>
    <a href="garage.html">YOUR GARAGE</a>
  </nav>
</header>

<section class="hero">
  <div class="eyebrow">THE COLLECTION / 009</div>
  <h1>THE MACHINES.</h1>
  <p>Pure performance. Legendary engines. Explore the machines that push engineering beyond its limits.</p>
</section>

<div class="controls">
  <input id="search" type="search" placeholder="Search a machine..." aria-label="Search cars">
  <select id="brand" aria-label="Filter by brand">
    <option value="all">All manufacturers</option>
    <option value="Lamborghini">Lamborghini</option>
    <option value="Bugatti">Bugatti</option>
    <option value="Nissan">Nissan</option>
    <option value="McLaren">McLaren</option>
    <option value="Porsche">Porsche</option>
    <option value="Ferrari">Ferrari</option>
    <option value="Audi">Audi</option>
    <option value="Lexus">Lexus</option>
  </select>
  <select id="favorites" aria-label="Filter favorites">
    <option value="all">All machines</option>
    <option value="favorites">My favorites</option>
  </select>
</div>

<main class="grid" id="carGrid"></main>

<footer>VELOCITY — PURE PERFORMANCE / ENGINEERING WITHOUT LIMITS</footer>

<script>
const cars = [
  {
    key:"huracan",
    number:"MACHINE / 001",
    name:"Lamborghini Huracán STO",
    brand:"Lamborghini",
    power:"640 HP",
    engine:"V10",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/Lamborghini%20Huracan%20STO.jpg"
  },
  {
    key:"chiron",
    number:"MACHINE / 002",
    name:"Bugatti Chiron",
    brand:"Bugatti",
    power:"1500 HP",
    engine:"W16",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/Bugatti_Chiron_2017.jpg"
  },
  {
    key:"gtr",
    number:"MACHINE / 003",
    name:"Nissan GT-R R35",
    brand:"Nissan",
    power:"565 HP",
    engine:"V6 Twin-Turbo",
    image:"https://images.unsplash.com/photo-1603386329225-868f9b1ee6c9?auto=format&fit=crop&w=1000&q=85"
  },
  {
    key:"mclaren",
    number:"MACHINE / 004",
    name:"McLaren 720S",
    brand:"McLaren",
    power:"710 HP",
    engine:"V8 Twin-Turbo",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/2019_Mclaren_720S.jpg"
  },
  {
    key:"porsche",
    number:"MACHINE / 005",
    name:"Porsche 911 GT3 RS",
    brand:"Porsche",
    power:"518 HP",
    engine:"Flat-Six",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/2024_Porsche_911_GT3_RS_992.jpg"
  },
  {
    key:"ferrari-sf90",
    number:"MACHINE / 006",
    name:"Ferrari SF90 Stradale",
    brand:"Ferrari",
    power:"986 HP",
    engine:"V8 Hybrid",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/2021_Ferrari_SF90_Stradale.jpg"
  },
  {
    key:"audi-r8-v10",
    number:"MACHINE / 007",
    name:"Audi R8 V10 Plus",
    brand:"Audi",
    power:"610 HP",
    engine:"V10",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/AudiR8v10.jpg"
  },
  {
    key:"lamborghini-svj",
    number:"MACHINE / 008",
    name:"Lamborghini Aventador SVJ",
    brand:"Lamborghini",
    power:"759 HP",
    engine:"V12",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/Lamborghini_Aventador_SVJ.jpg"
  },
  {
    key:"skyline-r34",
    number:"MACHINE / 009",
    name:"Nissan Skyline GT-R R34 — FOR PAUL",
    brand:"Nissan",
    power:"276 HP",
    engine:"RB26DETT Inline-Six",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/Nissan%20Skyline%20GT-R34.jpg"
  },
  {
    key:"lexus-lfa",
    number:"MACHINE / 010",
    name:"Lexus LFA",
    brand:"Lexus",
    power:"553 HP",
    engine:"V10",
    image:"https://commons.wikimedia.org/wiki/Special:FilePath/Lexus_LFA.jpg"
  }
];

const grid = document.getElementById("carGrid");
const search = document.getElementById("search");
const brand = document.getElementById("brand");
const favoritesFilter = document.getElementById("favorites");

function getFavorites(){
  try {
    return JSON.parse(localStorage.getItem("velocity-favorite-cars") || "[]");
  } catch {
    return [];
  }
}

function saveFavorites(list){
  localStorage.setItem("velocity-favorite-cars", JSON.stringify(list));
}

function renderCars(){
  const query = search.value.trim().toLowerCase();
  const selectedBrand = brand.value;
  const favorites = getFavorites();

  const filtered = cars.filter(car => {
    const matchesSearch =
      car.name.toLowerCase().includes(query) ||
      car.brand.toLowerCase().includes(query) ||
      car.engine.toLowerCase().includes(query);

    const matchesBrand =
      selectedBrand === "all" || car.brand === selectedBrand;

    const matchesFavorite =
      favoritesFilter.value !== "favorites" ||
      favorites.includes(car.key);

    return matchesSearch && matchesBrand && matchesFavorite;
  });

  grid.innerHTML = "";

  if(!filtered.length){
    grid.innerHTML = '<div class="empty">No machines found.</div>';
    return;
  }

  filtered.forEach(car => {
    const isFavorite = favorites.includes(car.key);
    const card = document.createElement("article");
    card.className = "card";

    const image = document.createElement("img");
    image.src = car.image;
    image.alt = car.name;
    image.loading = "lazy";
    image.onerror = function(){
      this.onerror = null;
      this.src = "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1000&q=80";
    };

    const body = document.createElement("div");
    body.className = "card-body";
    body.innerHTML = `
      <div class="number">${car.number}</div>
      <h2>${car.name}</h2>
      <div class="brand">${car.brand}</div>
      <div class="specs">
        <span>${car.power}</span>
        <span>${car.engine}</span>
      </div>
      <div class="actions">
        <a class="btn primary" href="car.html?car=${encodeURIComponent(car.key)}">VIEW MACHINE ↗</a>
        <button class="btn favorite ${isFavorite ? "active" : ""}" type="button" aria-label="Toggle favorite">
          ${isFavorite ? "♥ SAVED" : "♡ SAVE"}
        </button>
      </div>
    `;

    body.querySelector(".favorite").addEventListener("click", () => {
      let updated = getFavorites();

      if(updated.includes(car.key)){
        updated = updated.filter(key => key !== car.key);
      } else {
        updated.push(car.key);
      }

      saveFavorites(updated);
      renderCars();
    });

    card.append(image, body);
    grid.appendChild(card);
  });
}

search.addEventListener("input", renderCars);
brand.addEventListener("change", renderCars);
favoritesFilter.addEventListener("change", renderCars);

renderCars();
</script>
</body>
</html>
